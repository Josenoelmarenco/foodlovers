# Local development services.
# Production uses managed Neon (Postgres). This file is only for `npm run dev`.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v   (deletes the volume)

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodlovers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodlovers
      POSTGRES_PASSWORD: foodlovers
      POSTGRES_DB: foodlovers
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodlovers -d foodlovers"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
